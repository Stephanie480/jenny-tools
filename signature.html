<!DOCTYPE html>
<html>
<head>
    <title>Jenny Internet - Signature Generator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f4f4f4; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); }
        .header { border-bottom: 2px solid #e30613; margin-bottom: 20px; padding-bottom: 10px; display: flex; align-items: center; justify-content: space-between;}
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #666; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        #preview-area { margin-top: 30px; padding: 20px; border: 1px dashed #ccc; background: #fff; }
        .copy-btn { background: #e30613; color: white; border: none; padding: 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; font-size: 16px; }
        .copy-btn:hover { background: #b3050f; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="color:#e30613; margin:0;">Staff Signature Portal</h2>
        <img id="header-logo" src="Jenny Logo New.jpg" width="50" alt="Logo">
    </div>
    
    <div class="input-grid">
        <div style="grid-column: span 2;">
            <label>Select Entity</label>
            <select id="country" onchange="updateSignature()">
                <option value="SA">South Africa</option>
                <option value="BW">Botswana</option>
                <option value="SZ">eSwatini</option>
                <option value="MZ">Mozambique</option>
                <option value="LS">Lesotho</option>
                <option value="ZM">Zambia</option>
            </select>
        </div>
        <div><label>Full Name</label><input type="text" id="name" placeholder="Name Surname" oninput="updateSignature()"></div>
        <div><label>Position</label><input type="text" id="title" placeholder="Position" oninput="updateSignature()"></div>
        <div><label>Direct Number</label><input type="text" id="cell" placeholder="+27 87 170 0000" oninput="updateSignature()"></div>
        <div><label>Email Address</label><input type="text" id="email" placeholder="name@jennyinternet.africa" oninput="updateSignature()"></div>
    </div>

    <div id="preview-area">
        <div id="sig-content">
            <table cellpadding="0" cellspacing="0" style="font-family: Arial, sans-serif; color: #333; line-height: 1.2; min-width: 550px;">
                <tr>
                    <td style="padding-right: 20px; vertical-align: top; border-right: 2px solid #e30613;">
                        <img id="logo-img" src="" width="110" alt="Jenny Logo" style="display: block; border: 0;">
                    </td>
                    <td style="padding-left: 20px; vertical-align: top;">
                        <div id="disp-name" style="font-weight: bold; font-size: 14pt; color: #000;">Name Surname</div>
                        <div id="disp-title" style="font-size: 10pt; color: #e30613; margin-bottom: 8px;">Position</div>
                        <div style="font-size: 9pt; color: #333;">
                            <span id="disp-cell">Direct: +27 87 170 0000</span><br>
                            <span id="disp-email">Email: name@jennyinternet.africa</span><br>
                            <span id="disp-tel">Tel: +27 87 170 0000</span> | <a id="disp-web" href="#" style="color: #e30613; text-decoration: none; font-weight: bold;">www.jenny.co.za</a>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="padding-top: 15px;">
                        <div id="disp-addr" style="font-size: 8.5pt; color: #444; margin-bottom: 4px; font-weight: bold;">Address line</div>
                        <div id="disp-license" style="font-size: 7.5pt; color: #666; margin-bottom: 10px;">License details</div>
                        <div id="disp-disclaimer" style="font-size: 7.5pt; color: #999; line-height: 1.2; border-top: 1px solid #eee; padding-top: 8px; max-width: 580px;"></div>
                    </td>
                </tr>
            </table>
        </div>
    </div>
    
    <button class="copy-btn" onclick="copySignature()">Copy for Gmail</button>
</div>

<script>
    const repoURL = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
    document.getElementById('logo-img').src = repoURL + "Jenny%20Logo%20New.jpg";

    const officeData = {
        SA: {
            tel: "+27 87 170 0000", web: "www.jenny.co.za",
            addr: "Newcastle: 27 Gemsbok Street, Newcastle South Africa 2940 | Johannesburg: Unit 9 French Park, 90 Oxford Street, Randburg, Johannesburg South Africa 2194",
            license: "Individual Electronics Communications Service License: 0286/IECS/MAR/09 | Individual Electronics Communications Network License: 0286/IECNS/MAR/09",
            legalLink: "https://jenny.co.za/web/legal",
            disclaimerStart: "Confidentiality & Privacy Notice: This email is confidential and may be legally privileged. It is intended for the addressee only. This communication is subject to the terms, POPIA compliance, and legal policies of Jenny Internet (Pty) Ltd, which can be viewed at ",
            disclaimerEnd: ". If you have received this in error, please notify the sender and delete it immediately."
        },
        BW: {
            tel: "+26 73 972 712", web: "www.jenny.co.bw",
            addr: "Gaborone: Plot 50161, Section 8, Building 3, Unit 1, Block 5 Gaborone Botswana",
            license: "Electronic Communications Services License by Botswana Communications Regulatory Authority. License Number: SAP2017/046 Company Number: UIN BW00000863877",
            legalLink: "https://jenny.co.bw/legal",
            disclaimerStart: "This email is confidential and intended for the addressee only. If received in error, please notify the sender and delete it. This communication is subject to the terms and privacy policies of Jenny Internet (Proprietary) Limited, available at ",
            disclaimerEnd: "."
        },
        SZ: {
            tel: "+268 2411 3270", web: "www.Jenny.co.sz",
            addr: "Mbabane: Office no.15 Checkers Business Park Mbabane Swaziland",
            license: "Certificate of Incorporation: 1631 of 2015 Company ID: 201508181016311 Company Nr: R7/43909 Tax Certification: 105060718 | ESSCOM Network and Service License: GECS/001/17/JENNY",
            legalLink: "https://jenny.co.sz/legal",
            disclaimerStart: "Notice: Confidential and intended for the addressee. Usage of this info is subject to the eSwatini Data Protection Act and Jenny Internet eSwatini Limited legal terms at ",
            disclaimerEnd: ". If received in error, please delete."
        },
        MZ: {
            tel: "+27 87 170 0000", web: "www.Jenny.co.mz",
            addr: "Jenny Internet Limitada: Polana Cimento, Av.Julius Nyerere n53, 1st Floor",
            license: "Reg #: In Company Number: 101212807 Vat # :401045155 | ARECOM Service License 02/LC-A/ARECOM/2020 | ARECOM Network License 018/CA/ARECOM/2019",
            legalLink: "https://jenny.co.mz/en/legal",
            ptLegalLink: "https://www.jenny.co.mz/web/pt-pt/documentos_legais",
            disclaimerStart: "Confidentiality Notice: This email is confidential and intended for the addressee only. It is subject to the terms and privacy policies of Jenny Internet Mozambique Limited, available at ",
            disclaimerMid: ". If received in error, please notify the sender and delete. Aviso de Confidencialidade: Este e-mail é destinado apenas ao destinatário. Está sujeito aos termos e políticas de privacidade da Jenny Internet Mozambique Limited, disponíveis em ",
            disclaimerEnd: ". Se recebido por erro, por favor notifique o remetente e apague a mensagem."
        },
        LS: {
            tel: "+266 5201 0024", web: "www.jenny.co.ls",
            addr: "28 Motsoene Road, Dolphin House, Maseru Industrial , Lesotho",
            license: "Registration Number 76260 | Lesotho Communication Authority License # LSO/2022/TL01/2",
            legalLink: "https://jenny.co.ls/legal",
            disclaimerStart: "Notice: This email is confidential and intended for the addressee only. It is subject to the terms and privacy policies of Jenny Lesotho (Pty) Ltd, available at ",
            disclaimerEnd: ". If received in error, please notify the sender and delete."
        },
        ZM: {
            tel: "+260 700019301", web: "www.jenny.co.zm",
            addr: "Limited: 23rd Floor Findeco House, Cairo Road. Lusaka Zambia 10101",
            license: "LCO No. : 120190006154 | ZICTA Service License ZICTA/ICT/ECS/0154 | ZICTA Network License ZICTA/ICT/ECN/0154",
            legalLink: "https://jenny.co.zm/legal",
            disclaimerStart: "Notice: This email is confidential and intended for the addressee only. It is subject to the terms and privacy policies of Jenny Internet Zambia Limited, available at ",
            disclaimerEnd: ". If received in error, please notify the sender and delete."
        }
    };

    function updateSignature() {
        const country = document.getElementById('country').value;
        const d = officeData[country];
        
        document.getElementById('disp-name').innerText = document.getElementById('name').value || "Name Surname";
        document.getElementById('disp-title').innerText = document.getElementById('title').value || "Position";
        document.getElementById('disp-cell').innerText = "Direct: " + (document.getElementById('cell').value || "+27 87 170 0000");
        document.getElementById('disp-email').innerText = "Email: " + (document.getElementById('email').value || "name@jennyinternet.africa");
        document.getElementById('disp-tel').innerText = "Tel: " + d.tel;
        
        const webLink = document.getElementById('disp-web');
        webLink.innerText = d.web;
        webLink.href = "https://" + d.web;
        
        document.getElementById('disp-addr').innerText = d.addr;
        document.getElementById('disp-license').innerText = d.license;

        const discContainer = document.getElementById('disp-disclaimer');
        discContainer.innerHTML = ""; // Clear existing

        if (country === 'MZ') {
            discContainer.innerHTML = d.disclaimerStart + `<a href="${d.legalLink}" style="color: #999; text-decoration: underline;">${d.legalLink.replace('https://','')}</a>` + d.disclaimerMid + `<a href="${d.ptLegalLink}" style="color: #999; text-decoration: underline;">${d.ptLegalLink}</a>` + d.disclaimerEnd;
        } else {
            discContainer.innerHTML = d.disclaimerStart + `<a href="${d.legalLink}" style="color: #999; text-decoration: underline;">${d.legalLink.replace('https://','')}</a>` + d.disclaimerEnd;
        }
    }

    function copySignature() {
        const range = document.createRange();
        range.selectNode(document.getElementById("sig-content"));
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        document.execCommand("copy");
        alert("Signature copied! Go to Gmail settings and paste.");
    }
    updateSignature();
</script>
</body>
</html>
