<!DOCTYPE html>
<html>
<head>
    <title>Jenny Internet - Staff Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .portal-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 90%; }
        .logo { width: 120px; margin-bottom: 20px; }
        h1 { color: #333; font-size: 24px; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }
        .button-container { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .btn { display: block; padding: 15px; text-decoration: none; color: white; font-weight: bold; border-radius: 6px; transition: 0.3s; font-size: 18px; }
        .btn-red { background: #e30613; }
        .btn-red:hover { background: #b3050f; transform: translateY(-2px); }
        .btn-dark { background: #333; }
        .btn-dark:hover { background: #000; transform: translateY(-2px); }
        .footer { margin-top: 30px; font-size: 12px; color: #999; }
    </style>
</head>
<body>

<div class="portal-card">
    <img src="Jenny Logo New.jpg" alt="Jenny Logo" class="logo">
    <h1>Staff Brand Portal</h1>
    <p>Select a tool below to generate your official Jenny Internet materials.</p>
    
    <div class="button-container">
        <a href="signature.html" class="btn btn-red">Email Signature Generator</a>
        <a href="cards.html" class="btn btn-dark">Business Card Generator</a>
    </div>

    <div class="footer">
        &copy; 2025 Jenny Internet | Brand Assets Portal
    </div>
</div>

</body>
</html>
