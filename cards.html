<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jenny Internet Business Card Generator</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f4f4f4; font-family: 'Segoe UI', sans-serif; }
        
        #controls { 
            background: #fff; padding: 20px; border-bottom: 2px solid #e30613; 
            max-width: 800px; margin: 20px auto; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; font-size: 12px; color: #666; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #e30613; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }

        /* PRINT LAYOUT - FIXED FOR 12 CARDS */
        .page { width: 210mm; min-height: 297mm; padding: 5mm; margin: 20px auto; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); box-sizing: border-box; }
        
        .grid { 
            display: grid; 
            grid-template-columns: 90mm 90mm; 
            grid-template-rows: repeat(6, 45mm); /* 6 rows of 45mm fits 12 cards on A4 */
            gap: 2mm; 
            justify-content: center; 
        }
        
        /* Faint grey border for cutting */
        .card { 
            width: 90mm; 
            height: 45mm; 
            border: 0.5pt solid #d1d1d1; 
            display: flex; 
            align-items: center; 
            padding: 12px; 
            box-sizing: border-box; 
            background: white;
            page-break-inside: avoid;
        }
        
        .logo-container { width: 30%; padding-right: 15px; text-align: center; }
        .logo { max-width: 100%; height: auto; display: block; }
        .details { width: 70%; border-left: 2px solid #e30613; padding-left: 15px; }
        .display-name { font-size: 13pt; font-weight: bold; color: #000; margin: 0 0 3px 0; text-transform: uppercase; }
        .contact-item { font-size: 8pt; color: #333; margin-bottom: 2px; line-height: 1.2; }

        @media print {
            #controls { display: none; }
            .page { margin: 0; box-shadow: none; padding: 5mm; border: none; }
            body { background: white; }
            .card { border: 0.5pt solid #d1d1d1 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div id="controls">
    <h2 style="margin-top:0; color:#e30613;">Card Generator (12 Per Page)</h2>
    <div class="input-group"><label>Full Name</label><input type="text" id="inName" value="Mbali Phakathi" oninput="updateCards()"></div>
    <div class="input-group"><label>Cell Number</label><input type="text" id="inCell" value="078 916 7477" oninput="updateCards()"></div>
    <div class="input-group"><label>Office Number</label><input type="text" id="inOffice" value="087 170 0000" oninput="updateCards()"></div>
    <div class="input-group"><label>Email Address</label><input type="text" id="inEmail" value="sales@jennyinternet.co.za" oninput="updateCards()"></div>
    <button onclick="window.print()">Print 12 Cards</button>
</div>

<div class="page">
    <div class="grid" id="cardGrid"></div>
</div>

<script>
    function updateCards() {
        const name = document.getElementById('inName').value;
        const cell = document.getElementById('inCell').value;
        const office = document.getElementById('inOffice').value;
        const email = document.getElementById('inEmail').value;

        const cardHTML = `
            <div class="card">
                <div class="logo-container">
                    <img src="JennyLogo.png" class="logo" alt="Logo">
                </div>
                <div class="details">
                    <div class="display-name">${name}</div>
                    <div class="contact-item"><strong>📞</strong> ${cell}</div>
                    <div class="contact-item"><strong>📱</strong> ${office}</div>
                    <div class="contact-item"><strong>✉️</strong> ${email}</div>
                </div>
            </div>`;
        
        const grid = document.getElementById('cardGrid');
        grid.innerHTML = "";
        
        // Loop specifically set to 12
        for (let i = 0; i < 12; i++) {
            grid.innerHTML += cardHTML;
        }
    }
    // Initialize
    updateCards();
</script>

</body>
</html>
